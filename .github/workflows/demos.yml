# Test and build every demo on each pull request; deploy them to Cloudflare on
# pushes to main. Deploying needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with "Workers Scripts: Edit" on the account
#                          and "Workers Routes / DNS: Edit" on the growther.si zone
#   CLOUDFLARE_ACCOUNT_ID  the account that owns growther.si
name: demos

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The repository-wide gate, the same one the husky hooks run locally: eslint,
  # tsc, prettier, the download kit's manifest, the test-quality guard, and the
  # shared/ suite (chrome + Worker) with its 100% coverage floor.
  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint (eslint + tsc + download-kit manifest)
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Test quality (no hollow or @ts-nocheck tests)
        run: npm run check:test-quality
      - name: shared/ tests (100% coverage floor)
        run: npm run test:shared

  demo:
    needs: repo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every demo, plus shared/home: the demos.growther.si listing.
        demo: [fibonacci-vis, shared/home]
    defaults:
      run:
        working-directory: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.demo }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      # Runs with coverage, so the app's 100% floor is enforced here too.
      - run: npm test
      - run: npm run build
      # The build generates sitemap.xml, robots.txt, llms.txt, llms-full.txt and
      # the page's JSON-LD (shared/seo); this confirms they are there and agree.
      - name: SEO files (sitemap, robots, llms.txt, JSON-LD)
        run: node "$GITHUB_WORKSPACE/scripts/check-seo.mjs" dist
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

# Test and build every demo on each pull request; deploy them to Cloudflare on
# pushes to main. Deploying needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with "Workers Scripts: Edit" on the account
#                          and "Workers Routes / DNS: Edit" on the growther.si zone
#   CLOUDFLARE_ACCOUNT_ID  the account that owns growther.si
name: demos

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download kit matches its manifest
        working-directory: shared/downloadKit
        run: shasum -a 256 -c MANIFEST.sha256

  demo:
    needs: shared
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every demo, plus shared/home: the demos.growther.si listing.
        demo: [fibonacci-vis, shared/home]
    defaults:
      run:
        working-directory: ${{ matrix.demo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.demo }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
